spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: dev

  datasource:
    url: jdbc:postgresql://db.uzgpndjyjfmwzteygbjb.supabase.co:5432/postgres?sslmode=require
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect


server:
  port: 8080
