spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: dev

  datasource:
    url: jdbc:postgresql://db.uzgpndjyjfmwzteygbjb.supabase.co:5432/postgres?sslmode=require
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_JWT_ISSUER_URI:https://uzgpndjyjfmwzteygbjb.supabase.co/auth/v1}

server:
  port: ${PORT:8080}

# Bloco customizado da MyBoxy para segurança e pgcrypto (Evita o crash de binding no Railway)
app:
  security:
    pgcrypto-secret-key: ${PGCRYPTO_SECRET_KEY:myboxy_default_pgcrypto_secret_key_32bytes}
    pgcryptoSecretKey: ${PGCRYPTO_SECRET_KEY:myboxy_default_pgcrypto_secret_key_32bytes}
    jwt-secret: ${SUPABASE_JWT_SECRET:default_jwt_secret_key_myboxy_2026_dev}