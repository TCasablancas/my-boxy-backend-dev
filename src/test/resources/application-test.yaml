spring:
  datasource:
    url: jdbc:h2:mem:dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://example.test/auth/v1
          jwk-set-uri: http://localhost:9999/.well-known/jwks.json

app:
  security:
    pgcrypto-secret-key: test-pgcrypto-secret-key
  cors:
    allowed-origins: http://localhost:3000
